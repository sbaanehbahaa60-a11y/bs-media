<!doctype html><html dir="rtl"><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Readex+Pro:wght@400;500;700&family=Inter:wght@600;700;800&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{width:1080px;height:1350px;background:radial-gradient(circle at 50% 0%,#1b2347 0%,#0d1230 55%,#090c22 100%);font-family:'Readex Pro',sans-serif;color:#fff;position:relative;overflow:hidden}
.frame{position:absolute;inset:22px;border:2px solid rgba(240,196,64,.35);border-radius:34px}
.t1{position:absolute;top:62px;width:100%;text-align:center;font-size:104px;font-weight:700;color:#f4c542;line-height:1.1}
.pill{position:absolute;top:200px;left:50%;transform:translateX(-50%);background:#f4c542;color:#0d1230;border-radius:50px;padding:10px 40px;font-size:36px;font-weight:700;white-space:nowrap}
.hd{position:absolute;top:290px;left:60px;right:60px;display:grid;grid-template-columns:1fr 300px 1fr;color:#8f96bf;font-size:24px;text-align:center}
.rows{position:absolute;top:340px;left:60px;right:60px;display:flex;flex-direction:column;gap:12px}
.r{display:grid;grid-template-columns:1fr 300px 1fr;align-items:center;height:82px}
.tool{display:flex;align-items:center;gap:14px;font-family:Inter;font-weight:700;font-size:30px;direction:ltr;justify-content:center}
.b{width:52px;height:52px;border-radius:14px;display:flex;align-items:center;justify-content:center;font-family:Inter;font-weight:800;font-size:28px;color:#fff;flex:0 0 52px}
.mid{position:relative;height:72px;border-radius:40px;background:#141b42;border:2px solid #2b3570;display:flex;align-items:center;justify-content:center;font-size:31px;font-weight:700}
.mid.g{background:#f4c542;color:#0d1230;border-color:#f4c542}
.mid:before,.mid:after{content:"";position:absolute;top:50%;width:26px;border-top:3px dashed #f4c54288}
.mid:before{right:-34px}.mid:after{left:-34px}
.num{position:absolute;right:-6px;top:-10px;width:34px;height:34px;border-radius:50%;background:#e5484d;color:#fff;font-family:Inter;font-size:19px;font-weight:800;display:flex;align-items:center;justify-content:center}
.cta{position:absolute;top:1135px;left:50%;transform:translateX(-50%);width:880px;height:100px;border-radius:60px;background:linear-gradient(180deg,#f9d25a,#f0b92e);color:#0d1230;font-size:42px;font-weight:700;display:flex;align-items:center;justify-content:center;box-shadow:0 12px 40px rgba(240,190,50,.25)}
.foot{position:absolute;top:1262px;width:100%;text-align:center;font-size:24px;color:#8f96bf}
</style></head><body>
<div class="frame"></div>
<div class="t1">هاد ولا هاد؟ 🤔</div>
<div class="pill">أي أداة بتختار لصفحتك؟</div>
<div class="hd"><div>👉 يمين</div><div></div><div>شمال 👈</div></div>
<div class="rows" id="rows"></div>
<div class="cta">اكتب رقم القسم واختيارك بالتعليقات 👇</div>
<div class="foot">أكاديمية بهاء سباعنة</div>
<script>
const d=[["ChatGPT","#10a37f","كتابة النصوص","Claude","#d97757"],
["Midjourney","#222","توليد الصور","Leonardo","#7c3aed"],
["Runway","#111","فيديو بالذكاء","Google Veo","#4285f4"],
["ElevenLabs","#000","تعليق صوتي","Murf AI","#c026d3"],
["CapCut","#0f0f0f","مونتاج الفيديو","InShot","#e5484d"],
["Canva","#00a3c4","التصميم","Firefly","#e11d48"],
["Synthesia","#3b5bdb","فيديو بأفاتار","HeyGen","#0ea5a4"],
["Perplexity","#1f6f78","البحث عن أفكار","Gemini","#5b6cff"]];
document.getElementById('rows').innerHTML=d.map((x,i)=>`<div class="r"><div class="tool">${x[0]}<span class="b" style="background:${x[1]}">${x[0][0]}</span></div><div class="mid ${i%2?'g':''}"><span class="num">${i+1}</span>${x[2]}</div><div class="tool">${x[3]}<span class="b" style="background:${x[4]}">${x[3][0]}</span></div></div>`).join('');
</script>
</body></html>
